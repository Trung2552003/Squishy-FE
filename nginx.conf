# Giữ nguyên giao thức gốc khi đứng sau reverse proxy HTTPS (để cookie đăng nhập bật Secure đúng)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ảnh/video sản phẩm tải lên
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Phân giải tên "backend" lúc có request (nginx vẫn chạy được khi backend đang khởi động lại)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/ {
        proxy_pass $backend;
        proxy_read_timeout 300s;
    }

    # SignalR (realtime báo đơn đã thanh toán)
    location /hubs/ {
        proxy_pass $backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass $backend;
        expires 7d;
    }

    # File build có mã băm trong tên: cache lâu
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ứng dụng 1 trang: mọi đường dẫn (/cms/..., /dat-truoc/...) trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
